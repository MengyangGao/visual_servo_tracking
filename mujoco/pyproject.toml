[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-servo"
version = "0.4.0"
description = "MuJoCo IBVS/PBVS visual-servo and contact-manipulation learning platform"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "mujoco>=3.3.1",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
semantic = [
  "torch>=2.3",
  "transformers>=4.51,<5",
  "Pillow>=10",
]
test = [
  "pytest>=7.4",
]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "ruff>=0.9",
]

[project.scripts]
mujoco-servo = "mujoco_servo.cli:main"
mujoco-servo-benchmark = "mujoco_servo.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["mujoco_servo"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
